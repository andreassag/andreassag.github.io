<div class="repo-card">
  <div class="repo-card-top">
    <h3 class="repo-card-title mb-2">
      <a href="{{ site.baseurl }}{{ post.url }}">
        {{ post.title }}
      </a>
    </h3>
    <div style="font-size: 0.85rem; color: var(--text-muted);">
      {{ post.date | date: "%b %d, %Y"}}
    </div>
  </div>
</div>
